# Smoke test across every dag-bench project with HMP optimization.
# One backend, one small scale factor, baseline vs HMP -- exercises every DAG
# in the suite against the server architecture.
name: smoke-all
dag_bench: ${DAG_BENCH}
dee_bin: ../../target/release/dee
output_dir: ../results/smoke-all
verbosity: detailed

matrix:
  project: [p01_iot, p02_adtech, p03_ecommerce, p04_fraud, p05_hr, p06_logistics, p07_saas, p08_healthcare, p09_gaming, p10_energy]
  backend: [duckdb]
  sf: [0.1]
  variant: [unopt, hmp]

variants:
  unopt: {passes: []}
  hmp:   {passes: [hmp], hmp_use_pushdown: false}

dee_opt:
  hmp_max_runs: 3
  hmp_strategy: breadth

backends:
  duckdb:
    threads: 8

execution:
  repetitions: 3
  warmups: 1
  sample_interval_ms: 50
