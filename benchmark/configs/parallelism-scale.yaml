# Experiment A: does ParallelismTuning find anything once the nodes are big
# enough that one query can saturate the box?
#
# At sf=1 every dag-bench DAG here is one dominant query surrounded by
# free-to-create views, so there is no concurrent work to schedule. This
# sweeps the scale factor to find out whether that stays true.
name: parallelism-scale
dag_bench: ${DAG_BENCH}
dee_bin: ../../target/release/dee
output_dir: ../results/parallelism-scale
verbosity: detailed

matrix:
  project: [p03_ecommerce, p05_hr]
  backend: [duckdb]
  sf: [1, 4, 10]
  variant: [unopt, parallelism]

variants:
  unopt:       {passes: []}
  parallelism: {passes: [parallelism]}

dee_opt:
  parallelism_ladder: [[1, 2, 4, 8]]
  parallelism_seed_repeats: 2
  parallelism_confirm_runs: 1

backends:
  duckdb:
    threads: 8
    max_memory: 16GB

execution:
  repetitions: 5
  warmups: 1
  sample_interval_ms: 100
  timeout_s: 7200
