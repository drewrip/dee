# NodeFusion's adaptive materialization against its own rule, on p05_hr /
# DuckDB / sf=1.
#
# The question this settles: the rollup has to decide which of its CTEs to
# emit `AS MATERIALIZED`, and by default it decides by rule -- exactly the
# CTEs with two or more readers inside it. This measures whether pricing the
# choice beats the rule.
#
# Four cells:
#
#   unopt                     the DAG as dbt authored it
#   nodefusion                the rule, unpriced
#   nodefusion[adaptive,
#              objective=makespan]     the search, ordering and accepting on
#                                      wall clock
#   nodefusion[adaptive,
#              objective=query_time]   the search, ordering and accepting on
#                                      total node time
#
# The two adaptive cells are the point of running both objectives rather than
# picking one. Materializing a CTE stops the rollup recomputing it for every
# reader (cutting total work) and inserts a barrier its readers wait on
# (lengthening the path through the WITH chain). If the two objectives pick the
# same set on this DAG, that is a finding and the config should say so rather
# than the experiment being quietly rerun until they differ.
#
# # Reading this table
#
# **The adaptive cells are not free and the others are.** The rule-driven
# cell spends zero DAG runs -- it is a pure rewrite, so `payback` is immediate
# wherever it wins at all, and the only cost in the table is `opt_wall_ms`.
# Adaptive gives that up: it measures a baseline and then one candidate per
# run, which is `nodefusion_max_runs + 1` executions charged to the search.
# Comparing an adaptive cell to the rule on `engine_wall_ms` alone credits it
# with a win it had to buy. Read `payback`.
#
# `nodefusion_max_runs` is 3 rather than the default 1 because a search with
# one run can only ever try its top-ranked candidate, which tests the ranking's
# first place and nothing else.
#
# # What the spool constant does to this
#
# The ranking leans on a modelled per-byte spool cost, not a fitted one. On
# DuckDB the search usually finds nothing to rank: DuckDB already materializes
# a CTE referenced more than once, which is exactly the set the search may
# decide about. A postgres cell is where the search has a signal.
#
#   dee-bench run -c configs/p05-nodefusion-adaptive.yaml
name: p05-nodefusion-adaptive
dag_bench: ${DAG_BENCH}
dee_bin: /Users/aripberg/dee/target/release/dee
output_dir: ../results/p05-nodefusion-adaptive
verbosity: detailed

matrix:
  project: [p05_hr]
  backend: [duckdb]
  sf: [1]
  variant: [unopt, nf_rule, nf_adaptive_makespan, nf_adaptive_query_time]

variants:
  unopt: {passes: []}
  nf_rule:
    passes: [nodefusion]
  nf_adaptive_makespan:
    passes: [nodefusion]
    nodefusion_adaptive_materialize_ctes: true
    nodefusion_objective: makespan
    nodefusion_max_runs: 3
    nodefusion_search_budget: 32
  nf_adaptive_query_time:
    passes: [nodefusion]
    nodefusion_adaptive_materialize_ctes: true
    nodefusion_objective: query_time
    nodefusion_max_runs: 3
    nodefusion_search_budget: 32

# `nodefusion_objective` is written into the two adaptive variants rather than
# swept in a `dee_opt` block. Matrix pruning is per *pass*, not per setting:
# sweeping the objective would expand every nodefusion cell, and the rule cell
# ignores the objective entirely, so the sweep would produce two identical rule
# cells that only differ in a label. Four cells, not six.

backends:
  duckdb:
    threads: 8
    max_memory: 16GB

execution:
  # A p05 run at sf=1 takes about two seconds, so noise is the enemy and
  # repetitions are cheap.
  repetitions: 15
  warmups: 2
