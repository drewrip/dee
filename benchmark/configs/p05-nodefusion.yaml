# NodeFusion against the unoptimized DAG, on p05_hr / DuckDB / sf=1.
#
# Two cells, identical but for the pass:
#
#   unopt             the DAG as dbt authored it -- six layer_7 report tables
#                     and dept_salary_stats in layer_3, over twenty-odd views
#   nodefusion        the views those tables re-execute more than once,
#                     shared through one rollup node that each table reads
#                     back by `kind`
#
# The rollup materializes exactly the CTEs with two or more readers inside
# it, so there is no materialization knob to sweep here. The adaptive search
# over that choice has its own config, p05-nodefusion-adaptive.yaml.
#
# p05_hr is an interesting shape for this. `dept_salary_stats` is a table in
# layer_3 that layers 4-6 read, so views downstream of it read a stored table
# and stay outside the rollup; they are pasted into the report tables that
# read them, and read the rollup's kinds from there.
#
# The comparison is makespan -- `runs.engine_wall_ms`, the wall clock of the
# DAG measured inside one warm server. NodeFusion measures nothing and
# searches nothing, so unlike HMP there is no `*_objective` knob here.
#
# NodeFusion spends zero DAG runs, so `payback` is immediate where it wins at
# all, and the only cost in the table is `opt_wall_ms` -- the rewrite itself.
#
# Five repetitions because this is a runtime comparison rather than an
# optimizer trace: one run of each would not separate a real effect from noise
# on a DAG this size.
#
#   dee-bench run -c configs/p05-nodefusion.yaml
name: p05-nodefusion
dag_bench: ${DAG_BENCH}
dee_bin: /Users/aripberg/dee/target/release/dee
output_dir: ../results/p05-nodefusion
verbosity: detailed

matrix:
  project: [p05_hr]
  backend: [duckdb]
  sf: [1]
  variant: [unopt, nodefusion]

variants:
  unopt:      {passes: []}
  nodefusion: {passes: [nodefusion]}

backends:
  duckdb:
    threads: 8
    max_memory: 16GB

execution:
  repetitions: 5
  warmups: 1
  sample_interval_ms: 100
  timeout_s: 3600
