# Smallest useful run: one project, one scale factor, baseline vs HMP.
# Completes in a couple of minutes and exercises every stage of the harness.
name: smoke
dag_bench: ${DAG_BENCH}
dee_cli: ../../target/release/dee-cli
output_dir: ../results/smoke
verbosity: detailed

matrix:
  project: [p01_iot]
  backend: [duckdb]
  sf: [0.1]
  variant: [unopt, hmp]

variants:
  unopt: {passes: []}
  hmp:   {passes: [hmp], hmp_use_pushdown: false}

dee_opt:
  hmp_max_runs: 3
  hmp_strategy: breadth

backends:
  duckdb:
    threads: 8
    num_connections: 16

execution:
  repetitions: 3
  warmups: 1
  sample_interval_ms: 50
