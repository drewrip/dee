# Prepare p02-p09 on PostgreSQL and capture their DAGs.
#
# Not a measurement. This run exists for its side effects: it generates and
# loads each project's data at sf=0.5 into the shared `dee-bench-pg-data`
# volume, and records every project's DAGs -- node ids, materializations,
# dependencies and SQL -- into `metadata.duckdb`, where `dag_version_nodes` is
# the only place the node SQL is kept (the `dag_graph` parquet carries
# structure but leaves `query_text` null).
#
# The `nf_rule` cell is what makes the emission experiment possible. Running
# NodeFusion records a second DAG version whose `dee_fused` node carries the
# rollup query, and the CTEs that query marks `AS MATERIALIZED` *are* the
# pass's own choice of shared models -- the ones with two or more readers
# inside the rollup. That set, read back off the emitted SQL, is what the
# experiment promotes to table nodes. It is the pass's rule, not a
# reimplementation of it, which is the whole point of reading it from the
# output rather than recomputing it here.
#
# Both are what the emission experiment needs: the DAG to rewrite, and the data
# to run it against. The experiment itself is driven by
# scripts/nodefusion_shape_experiment.py, against a container brought up on the
# same volume afterwards, so nothing here has to be a fair timing.
#
# sf=0.5 rather than the sf=1 that p05 was measured at: eight projects at sf=1
# is tens of gigabytes to generate and load before a single comparison runs.
# Every project here is measured at the same scale, so they stay comparable
# with each other; p05 at sf=1 remains the anchor for absolute numbers.
#
# One unoptimized run per project, no warmup -- enough to prove the DAG
# executes and the data is really there.
#
#   DAGBENCH_PG_UNLOGGED=0 dee-bench run -c configs/p02-p09-prepare.yaml --no-viz
name: p02-p09-prepare
dag_bench: ${DAG_BENCH}
dee_bin: /Users/aripberg/dee/target/release/dee
output_dir: ../results/p02-p09-prepare
verbosity: detailed

matrix:
  project: [p02_adtech, p03_ecommerce, p04_fraud, p05_hr, p06_logistics,
            p07_saas, p08_healthcare, p09_gaming]
  backend: [postgres]
  sf: [0.5]
  variant: [unopt, nf_rule]

variants:
  unopt: {passes: []}
  nf_rule:
    passes: [nodefusion]

backends:
  postgres:
    provider: container
    image: postgres:18
    port: 55433
    cpus: 8
    memory: 12g
    shm_size: 2g
    num_connections: 16
    settings:
      shared_buffers: 2GB
      work_mem: 64MB
      max_worker_processes: 16
      max_parallel_workers: 12
      max_parallel_workers_per_gather: 12

execution:
  repetitions: 1
  warmups: 0
  sample_interval_ms: 200
  timeout_s: 7200
