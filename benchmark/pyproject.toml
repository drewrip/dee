[project]
name = "dee-bench"
version = "0.1.0"
description = "Benchmarking harness for dee against dag-bench"
requires-python = ">=3.11"
dependencies = [
    # Results storage and analysis.
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy",
    # Cross-platform process CPU/RSS/IO sampling (Linux and macOS).
    "psutil>=5.9",
    # Workload preparation (dag-bench projects are dbt projects).
    "PyYAML",
    "dbt-core",
    "dbt-duckdb",
    "dbt-postgres",
    # Visualization: plotly for the interactive dashboard, matplotlib for the
    # static png/pdf each chart links to.
    "plotly>=5.20",
    "matplotlib",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dee-bench = "dee_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dee_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
