[package]
name = "dee"
authors.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
duckdb = { git = "https://github.com/drewrip/duckdb-rs.git", features = ["modern-full", "bundled"] }
thiserror = "2.0.18"
async-trait = "0.1.89"
tokio = { version = "1.50.0", features = ["full"] }
tempfile = "3.27.0"
r2d2 = "0.8.10"
futures = "0.3.32"
log = "0.4.29"
datafusion = { git = "https://github.com/drewrip/datafusion.git", rev = "6540201cc3954b1c67adb4676ebf0641250fa065", features = ["sql"] }
chrono = { version = "0.4.45", features = ["serde"] }
itertools = "0.14.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
